    Policies:
      type: object
      properties:
        default:
          $ref: '#/components/schemas/PolicyEnum'
        available:
          type: array
          items:
            $ref: '#/components/schemas/PolicyEnum'
        daily_gate:
          $ref: '#/components/schemas/DailyGateBounds'
        lead_time:
          $ref: '#/components/schemas/LeadTimeBounds'
      required:
      - available
      - daily_gate
      - default
      - lead_time
    PolicyEnum:
      enum:
      - daily_gate
      - lead_time
      type: string
      description: |-
        * `daily_gate` - DAILY_GATE
        * `lead_time` - LEAD_TIME
    Problem:
      type: object
      description: RFC 9457 problem details (application/problem+json).
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          nullable: true
        request_id:
          type: string
        errors:
          type: object
          additionalProperties: {}
          description: Field-level validation errors.
      required:
      - detail
      - instance
      - request_id
      - status
      - title
      - type
    QueryEcho:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        timezone:
          type: string
          description: Zone of the delivery dates and gate time.
        policy:
          $ref: '#/components/schemas/PolicyEnum'
        gate_time:
          type: string
          nullable: true
          description: HH:MM Europe/London.
        gate_days_before:
          type: integer
          nullable: true
        lead_time_h:
          type: integer
          nullable: true
      required:
      - date_from
      - date_to
      - gate_days_before
      - gate_time
      - lead_time_h
      - policy
      - timezone
    Ready:
      type: object
      properties:
        status:
          type: string
        forecast_rows:
          type: integer
        actual_rows:
          type: integer
      required:
      - actual_rows
      - forecast_rows
      - status
    SummaryResponse:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/QueryEcho'
        data_version:
          type: integer
        matching_method:
          type: string
        metrics:
          $ref: '#/components/schemas/MetricSummary'
      required:
      - data_version
      - matching_method
      - metrics
      - query
    TimeseriesResponse:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/QueryEcho'
        data_version:
          type: integer
        forecast:
          type: array
          items:
            $ref: '#/components/schemas/ForecastPoint'
