[project]
name = "engridapi"
version = "0.1.0"
description = "EnGrid wind forecast monitor: Elexon ingestion, forecast selection at a decision cutoff, accuracy metrics and the public API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==6.1.2",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=23",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs>=3.16",
    "hypothesis>=6.130",
    "mypy>=1.15",
    "pandas-stubs>=2.3",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "pytest-django>=4.11",
    "respx>=0.22",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "DJ", "DTZ", "PT", "RUF", "T20", "PD", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PD"]
# Django's Meta.constraints / indexes are conventional mutable class attributes.
"apps/*/models.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^venv/", "^\\.venv/", "/migrations/"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# pandas-stubs cannot type element-wise comparisons on Series rows; keep tests readable.
module = ["tests.*"]
disable_error_code = ["operator", "arg-type", "call-overload", "index", "union-attr"]

[[tool.mypy.overrides]]
module = ["environ.*", "tenacity.*", "hypothesis.*", "respx.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "engridapi.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "engridapi.settings.test"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=apps --cov-report=term-missing:skip-covered --cov-fail-under=80"
markers = [
  "unit: pure tests, no database",
  "integration: tests that use the database",
  "api: HTTP-level tests through the DRF test client",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/management/commands/*"]
